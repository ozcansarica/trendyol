name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deploy için gerekli izinler
permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek deploy; devam edeni iptal etme (yayını yarıda kesmemek için)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Pages ayarı "GitHub Actions" değilse otomatik etkinleştirmeyi dener
          enablement: true

      - name: Cache-busting sürüm etiketini uygula
        # ES module importlarındaki __BUILD_VERSION__ yer tutucusunu commit SHA'sı ile
        # değiştirir, böylece her deploy'da tarayıcı/CDN eski assets/*.js'i önbellekten
        # sunmak yerine yeni sürümü çeker. Sadece deploy artifact'inde değişir, repoda değil.
        run: sed -i "s/__BUILD_VERSION__/${GITHUB_SHA}/g" index.html urunler.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Statik site kök dizinden yayınlanıyor
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
