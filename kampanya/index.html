<title>Kampanya İndirim Hesaplayıcı</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --bg:#07111e;--surf:#0d1e32;--card:#122840;--brd:#1d3553;
  --acc:#f59e0b;--grn:#22c55e;--red:#f87171;--blu:#60a5fa;
  --txt:#dce9f8;--sub:#7aadc8;--mut:#3f607e;
  --sel:rgba(245,158,11,.09);--ring:rgba(245,158,11,.4);
}
@media(prefers-color-scheme:light){:root{
  --bg:#eef3f9;--surf:#f6f9fc;--card:#fff;--brd:#c5d5e8;
  --acc:#d97706;--grn:#16a34a;--red:#dc2626;--blu:#2563eb;
  --txt:#0d1e32;--sub:#4a6a88;--mut:#8aadc8;
  --sel:rgba(217,119,6,.07);--ring:rgba(217,119,6,.35);
}}
:root[data-theme=light]{--bg:#eef3f9;--surf:#f6f9fc;--card:#fff;--brd:#c5d5e8;--acc:#d97706;--grn:#16a34a;--red:#dc2626;--blu:#2563eb;--txt:#0d1e32;--sub:#4a6a88;--mut:#8aadc8;--sel:rgba(217,119,6,.07);--ring:rgba(217,119,6,.35)}
:root[data-theme=dark]{--bg:#07111e;--surf:#0d1e32;--card:#122840;--brd:#1d3553;--acc:#f59e0b;--grn:#22c55e;--red:#f87171;--blu:#60a5fa;--txt:#dce9f8;--sub:#7aadc8;--mut:#3f607e;--sel:rgba(245,158,11,.09);--ring:rgba(245,158,11,.4)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);height:100vh;overflow:hidden}
/* Toast */
.toast{position:fixed;top:58px;left:50%;transform:translateX(-50%);
  padding:7px 18px;border-radius:8px;font-size:13px;font-weight:700;
  z-index:999;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap}
.toast.show{opacity:1}
/* Header */
.hdr{height:50px;background:var(--surf);border-bottom:1px solid var(--brd);
  display:flex;align-items:center;gap:12px;padding:0 14px;flex-shrink:0}
.logo{font-size:13px;font-weight:800;color:var(--acc)}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.tbtn{background:var(--card);border:1px solid var(--brd);border-radius:6px;
  padding:5px 10px;cursor:pointer;color:var(--sub);font-size:13px}
.tbtn:hover{border-color:var(--acc);color:var(--acc)}
/* Layout */
.layout{display:flex;height:calc(100vh - 50px)}
/* Left panel */
.lpanel{width:340px;min-width:240px;flex-shrink:0;border-right:1px solid var(--brd);
  display:flex;flex-direction:column;overflow:hidden}
.sh{padding:10px 11px;display:flex;flex-direction:column;gap:7px;
  border-bottom:1px solid var(--brd);flex-shrink:0;background:var(--surf)}
.sinput{width:100%;padding:7px 10px;background:var(--card);border:1.5px solid var(--brd);
  border-radius:7px;font-size:13px;color:var(--txt);outline:none;transition:border-color .12s}
.sinput:focus{border-color:var(--acc)}
.sinput::placeholder{color:var(--mut)}
.srow{display:flex;align-items:center;gap:8px}
.sortbar{display:flex;gap:4px}
.sb{background:var(--card);border:1px solid var(--brd);border-radius:5px;
  padding:3px 8px;font-size:11px;font-weight:700;color:var(--sub);cursor:pointer}
.sb.act,.sb:hover{border-color:var(--acc);color:var(--acc)}
.rcount{font-size:11px;color:var(--mut);margin-left:auto}
.grid{flex:1;overflow-y:auto;padding:8px}
.gi{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
/* Cards */
.card{background:var(--card);border:1.5px solid var(--brd);border-radius:8px;padding:10px;
  cursor:pointer;user-select:none;position:relative;transition:border-color .12s,box-shadow .12s}
.card:hover{border-color:var(--acc);box-shadow:0 0 0 1px var(--ring)}
.card.sel{background:var(--sel);border-color:var(--acc);box-shadow:0 0 0 2px var(--ring)}
.cc{position:absolute;top:7px;right:7px;width:16px;height:16px;border-radius:50%;
  border:1.5px solid var(--brd);background:var(--surf);
  display:flex;align-items:center;justify-content:center;transition:all .12s}
.card.sel .cc{background:var(--acc);border-color:var(--acc)}
.cn{font-size:11px;font-weight:700;line-height:1.35;padding-right:18px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:30px}
.cb{font-size:9.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
.cf{font-size:15px;font-weight:800;color:var(--acc);margin-top:4px;font-variant-numeric:tabular-nums}
.cf span{font-size:9.5px;font-weight:500;color:var(--sub);margin-left:2px}
/* Right panel */
.rpanel{flex:1;display:flex;flex-direction:column;overflow:hidden}
.ri{flex:1;overflow-y:auto;padding:13px 15px;display:flex;flex-direction:column;gap:11px}
.empty-calc{padding:60px 20px;text-align:center;color:var(--mut);font-size:14px;line-height:1.9}
/* Platform fee row */
.pf-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pf-lbl{font-size:11.5px;color:var(--sub);font-weight:700;white-space:nowrap}
.pf-btn{background:var(--card);border:1.5px solid var(--brd);border-radius:6px;
  padding:5px 11px;font-size:11.5px;font-weight:700;color:var(--sub);cursor:pointer;transition:all .12s}
.pf-btn.act{background:var(--acc);border-color:var(--acc);color:#000}
.pf-btn:not(.act):hover{border-color:var(--acc);color:var(--acc)}
/* Product input rows */
.sec-title{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.prod-row{background:var(--card);border:1px solid var(--brd);border-radius:8px;padding:10px 12px;margin-bottom:6px}
.pr-name{font-size:11.5px;font-weight:700;color:var(--txt);line-height:1.3}
.pr-bk{font-size:10px;color:var(--mut);margin-top:1px}
.pr-inp{display:flex;gap:6px;align-items:flex-end;margin-top:8px;flex-wrap:wrap}
.pr-inp label{display:flex;flex-direction:column;gap:3px;font-size:10px;color:var(--sub);font-weight:600}
.pi{padding:5px 7px;background:var(--surf);border:1.5px solid var(--brd);
  border-radius:5px;font-size:12px;color:var(--txt);outline:none;transition:border-color .12s}
.pi:focus{border-color:var(--acc)}
.pi::placeholder{color:var(--mut)}
.w82{width:82px}.w54{width:54px}.w60{width:60px}
.rm-btn{background:none;border:1.5px solid var(--brd);border-radius:5px;
  width:27px;height:27px;cursor:pointer;color:var(--mut);font-size:12px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .12s}
.rm-btn:hover{border-color:var(--red);color:var(--red)}
.hint{padding:12px 14px;background:var(--card);border-radius:7px;
  font-size:12px;color:var(--sub);text-align:center;border:1px solid var(--brd)}
/* Scenario cards */
.sc-wrap{display:flex;flex-direction:column;gap:9px}
.sc-card{background:var(--surf);border:1px solid var(--brd);border-radius:10px;padding:12px 14px}
.sc-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sc-ttl{font-size:13px;font-weight:800;color:var(--txt)}
.badge{background:var(--acc);color:#000;font-size:9.5px;font-weight:800;
  border-radius:4px;padding:2px 6px;letter-spacing:.2px}
.badge.bl{background:var(--blu);color:#fff}
.badge.gr{background:var(--grn);color:#000}
.sc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:9px}
.sc-it{background:var(--card);border-radius:6px;padding:8px 9px}
.sc-il{font-size:9.5px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.sc-iv{font-size:15px;font-weight:800;color:var(--txt);margin-top:2px;font-variant-numeric:tabular-nums;line-height:1.1}
.sc-is{font-size:9.5px;color:var(--sub);margin-top:2px;line-height:1.3}
.sc-it.grn .sc-iv{color:var(--grn)}
.sc-it.red .sc-iv{color:var(--red)}
.sc-it.acc .sc-iv{color:var(--acc)}
.sc-footer{border-top:1px solid var(--brd);padding-top:8px;display:flex;gap:14px;flex-wrap:wrap}
.sc-fi{display:flex;flex-direction:column;gap:2px}
.sc-fl{font-size:9.5px;color:var(--mut)}
.sc-fv{font-size:12.5px;font-weight:700;color:var(--txt)}
.sc-qty{font-size:10.5px;color:var(--sub);margin-top:6px;line-height:1.5;border-top:1px solid var(--brd);padding-top:7px}
/* Hedef oran */
.hk-row{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
.hk-lbl{font-size:12px;color:var(--sub)}
.hk-inp{width:62px;border:1px solid var(--brd);border-radius:6px;padding:3px 8px;background:var(--bg2);color:var(--txt);font-size:13px;text-align:right}
/* Kampanya değerlendirme bloğu */
.pe-block{margin-top:8px;padding-top:8px;border-top:1px solid var(--brd)}
.pe-verdict{font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:5px;margin-bottom:6px}
.pe-ok{background:rgba(34,197,94,.14);color:var(--grn)}
.pe-no{background:rgba(239,68,68,.11);color:var(--red)}
.pe-item{display:flex;justify-content:space-between;align-items:flex-start;padding:4px 0;gap:6px;border-bottom:1px solid color-mix(in srgb,var(--brd) 50%,transparent)}
.pe-item:last-child{border-bottom:none}
.pe-iname{flex:1;font-size:11px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt)}
.pe-inum{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-size:10px;white-space:nowrap}
.pe-sep{color:var(--sub)}
.pe-bun{color:var(--grn);font-weight:700}
.pe-empty{font-size:11px;color:var(--sub);text-align:center;padding:4px 0}
/* Responsive */
@media(max-width:720px){
  body{height:auto;overflow:auto}
  .layout{flex-direction:column;height:auto}
  .lpanel{width:100%;border-right:none;border-bottom:1px solid var(--brd);max-height:55vh}
  .sc-grid{grid-template-columns:1fr 1fr}
}
</style>

<div class="toast" id="toast"></div>

<div class="hdr">
  <div class="logo">📦 Kampanya İndirim Hesaplayıcı</div>
  <div class="hdr-r">
    <input type="file" id="urunXlsxIn" accept=".xlsx" style="display:none">
    <button class="tbtn" onclick="document.getElementById('urunXlsxIn').click()" title="Barkod No + Ürün Adı + Alış Tutarı (KDV) kolonlu Excel yükle">📂 Ürün Yükle</button>
    <span id="selcnt" style="font-size:12px;color:var(--sub)">0 seçili</span>
    <button class="tbtn" onclick="toggleTheme()">◑</button>
  </div>
</div>

<div class="layout">
  <div class="lpanel">
    <div class="sh">
      <input class="sinput" id="sq" placeholder="Ürün adı veya barkod ara…" oninput="onSearch()" autocomplete="off" spellcheck="false">
      <div class="srow">
        <div class="sortbar">
          <button class="sb act" data-sk="a" onclick="setSort('a')">A→Z</button>
          <button class="sb" data-sk="pa" onclick="setSort('pa')">↑ Fiyat</button>
          <button class="sb" data-sk="pd" onclick="setSort('pd')">↓ Fiyat</button>
        </div>
        <button class="sb" id="editModeBtn" onclick="toggleEditMode()">✏️ Maliyet</button>
        <span class="rcount" id="rcount"></span>
      </div>
    </div>
    <div class="grid"><div class="gi" id="grid"></div></div>
  </div>

  <div class="rpanel">
    <div class="ri" id="ri">
      <div class="empty-calc">← Sol panelden ürün seçin<br><small style="font-size:12px;opacity:.6">Birden fazla ürün seçip kampanya indirimini hesaplayın</small></div>
    </div>
  </div>
</div>

<script>
// ========== XLSX PARSING ==========

function _xColIdx(ref) {
  var m = ref.match(/^([A-Z]+)/);
  var col = 0;
  for (var i = 0; i < m[1].length; i++) col = col * 26 + (m[1].charCodeAt(i) - 64);
  return col - 1;
}

async function _xXml(zip, path) {
  var entry = zip.file(path);
  if (!entry) return null;
  var bytes = await entry.async('uint8array');
  return new DOMParser().parseFromString(new TextDecoder('utf-8').decode(bytes), 'application/xml');
}

async function _xSheet(zip) {
  var wb = await _xXml(zip, 'xl/workbook.xml');
  var rl = await _xXml(zip, 'xl/_rels/workbook.xml.rels');
  if (!wb || !rl) return 'xl/worksheets/sheet1.xml';
  var sheets = wb.getElementsByTagName('sheet');
  if (!sheets.length) return 'xl/worksheets/sheet1.xml';
  var rId = sheets[0].getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id') || sheets[0].getAttribute('r:id');
  var rels = rl.getElementsByTagName('Relationship');
  for (var i = 0; i < rels.length; i++) {
    if (rels[i].getAttribute('Id') === rId) {
      var t = rels[i].getAttribute('Target').replace(/^\//,'');
      return t.startsWith('xl/') ? t : 'xl/' + t;
    }
  }
  return 'xl/worksheets/sheet1.xml';
}

async function _xRows(zip) {
  var sst = [];
  var sstDoc = await _xXml(zip, 'xl/sharedStrings.xml');
  if (sstDoc) {
    var sis = sstDoc.getElementsByTagName('si');
    for (var i = 0; i < sis.length; i++) {
      var txt = '';
      var ts = sis[i].getElementsByTagName('t');
      for (var j = 0; j < ts.length; j++) txt += ts[j].textContent;
      sst.push(txt);
    }
  }
  var sheetDoc = await _xXml(zip, await _xSheet(zip));
  if (!sheetDoc) throw new Error('Çalışma sayfası bulunamadı.');
  var rows = [];
  var rowEls = sheetDoc.getElementsByTagName('row');
  for (var r = 0; r < rowEls.length; r++) {
    var row = [];
    var cells = rowEls[r].getElementsByTagName('c');
    for (var c = 0; c < cells.length; c++) {
      var cell = cells[c];
      var ref = cell.getAttribute('r'); if (!ref) continue;
      var idx = _xColIdx(ref);
      var tp = cell.getAttribute('t');
      var vEl = cell.getElementsByTagName('v')[0];
      var val = null;
      if (tp === 's') val = vEl ? sst[parseInt(vEl.textContent, 10)] : null;
      else if (tp === 'str') val = vEl ? vEl.textContent : null;
      else if (tp === 'inlineStr') { var t2 = cell.getElementsByTagName('t')[0]; val = t2 ? t2.textContent : null; }
      else if (vEl) val = parseFloat(vEl.textContent);
      row[idx] = val;
    }
    rows.push(row);
  }
  return rows;
}

function _xNum(v) { var n = typeof v === 'number' ? v : parseFloat(v); return Number.isFinite(n) ? n : 0; }

async function parseUrunlerXlsx(ab) {
  if (typeof JSZip === 'undefined') throw new Error('JSZip yüklenemedi. Sayfayı yenileyip tekrar deneyin.');
  var zip = await JSZip.loadAsync(ab);
  var rows = await _xRows(zip);
  if (rows.length < 2) throw new Error('Dosyada veri satırı bulunamadı.');
  var hdr = rows[0].map(function(h){ return h == null ? '' : String(h).trim(); });
  var ci = function(name){ return hdr.indexOf(name); };
  // Hem "Barkod No + Ürün Adı" formatını hem "ÜRÜN İSMİ + BARKOD" formatını destekle
  var iUrun = ci('Ürün Adı') !== -1 ? ci('Ürün Adı') : (ci('ÜRÜN İSMİ') !== -1 ? ci('ÜRÜN İSMİ') : ci('Ürün İsmi'));
  var iBarkod = ci('Barkod No') !== -1 ? ci('Barkod No') : (ci('BARKOD') !== -1 ? ci('BARKOD') : ci('Barkod'));
  var iAlis = ci('Alış Tutarı (KDV)') !== -1 ? ci('Alış Tutarı (KDV)') : ci('Maliyet');
  if (iUrun === -1) throw new Error('"Ürün Adı" veya "ÜRÜN İSMİ" kolonu bulunamadı.');
  var urunler = [];
  for (var r = 1; r < rows.length; r++) {
    var row = rows[r]; if (!row) continue;
    var ad = row[iUrun];
    if (ad == null || String(ad).trim() === '') continue;
    var barkod = (iBarkod !== -1 && row[iBarkod] != null) ? String(row[iBarkod]).trim() : '';
    var maliyet = iAlis !== -1 ? _xNum(row[iAlis]) : 0;
    urunler.push({b: barkod || String(ad).trim(), a: String(ad).trim(), f: maliyet});
  }
  if (!urunler.length) throw new Error('Hiç geçerli ürün satırı bulunamadı.');
  return urunler;
}


// ========== TOAST ==========

function showToast(msg, ok) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = ok ? 'var(--grn)' : 'var(--red)';
  t.style.color = ok ? '#000' : '#fff';
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(function(){ t.classList.remove('show'); }, 3200);
}

// ========== CORE FUNCTIONS ==========

function getPF() { return platMode === 'normal' ? 8.19 : 13.19; }

function minQty(s) {
  s = +s;
  if (s < 25) return 6;
  if (s < 35) return 4;
  if (s < 50) return 3;
  if (s < 75) return 2;
  return 1;
}

function kargoFor(b) {
  b = +b;
  if (b < 200) return 41;
  if (b < 350) return 79;
  return 93;
}

function calcSingleProfit(e, pf) {
  var qty = minQty(+e.satis);
  var rev = +e.satis * qty;
  var alis = (+e.alis || 0) * qty;
  var kom = rev * (+e.kom || 0) / 100;
  var kargo = kargoFor(rev);
  var r = 20 / 120;
  var stopaj = rev / 1.20 * 0.01;
  var odenecekKdv = Math.max(0, rev*r - (alis*r + kargo*r + kom*r + pf*r));
  return rev - alis - kargo - pf - kom - stopaj - odenecekKdv;
}

function buildEvalBlock(entries, sc, basketProfit, profitRate, pf) {
  var items = entries.map(function(e) {
    if (+e.alis <= 0) return null;
    var revFrac = sc.combined > 0 ? (+e.satis * e.qty) / sc.combined : 0;
    var bundleShare = basketProfit * revFrac;
    var singleP = calcSingleProfit(e, pf);
    return { e: e, bundleShare: bundleShare, singleP: singleP, viable: bundleShare >= singleP };
  }).filter(function(p){ return p !== null; });
  if (!items.length) return '';

  var viableItems = items.filter(function(p){ return p.viable; });
  var meetsTarget = profitRate !== null && profitRate >= hedefOran;

  var html = '<div class="pe-block">';
  html += '<div class="pe-verdict ' + (meetsTarget ? 'pe-ok' : 'pe-no') + '">';
  if (meetsTarget) {
    html += '✓ Kampanya önerilir · Kâr Oranı %' + profitRate.toFixed(1) + ' ≥ Hedef %' + hedefOran;
  } else {
    html += '✗ Önerilmez · Kâr Oranı %' + (profitRate !== null ? profitRate.toFixed(1) : '—') + ' < Hedef %' + hedefOran;
  }
  html += '</div>';

  if (viableItems.length) {
    viableItems.forEach(function(p) {
      var name = p.e.a.length > 30 ? p.e.a.substring(0, 30) + '…' : p.e.a;
      html += '<div class="pe-item">'
        + '<div class="pe-iname">' + escH(name) + '</div>'
        + '<div class="pe-inum">'
        + '<span class="pe-sep">Tekli: ' + tl(p.singleP) + '</span>'
        + '<span class="pe-bun">Sepette: ' + tl(p.bundleShare) + ' ✓</span>'
        + '</div></div>';
    });
  } else {
    html += '<div class="pe-empty">Hiçbir ürün tekli satıştan iyi değil</div>';
  }

  html += '</div>';
  return html;
}

function tl(v) {
  return Number(v).toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' ₺';
}

function escH(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escA(s) {
  return escH(s).replace(/"/g,'&quot;');
}

function calcScenario(entries, pf) {
  const combined = entries.reduce((s,e) => s + e.satis * e.qty, 0);
  if (combined <= 0) return null;
  const kargoComb = kargoFor(combined);
  let sepCost = 0;
  entries.forEach(e => {
    const mq = minQty(e.satis);
    const nOrd = Math.max(1, Math.ceil(e.qty / mq));
    sepCost += nOrd * kargoFor(e.satis * mq) + nOrd * pf;
  });
  const combCost = kargoComb + pf;
  const savings = sepCost - combCost;
  const maxPct = savings > 0 ? savings / combined * 100 : 0;
  const recPct = maxPct * 0.7;
  const discBasket = combined * (1 - recPct / 100);
  const totalQty = entries.reduce((s,e) => s + e.qty, 0);
  return { combined, kargoComb, sepCost, combCost, savings, maxPct, recPct, discBasket, totalQty };
}

function scaleToTarget(entries, target) {
  const base = entries.reduce((s,e) => s + e.satis * e.qty, 0);
  if (base >= target || base <= 0) return entries;
  const scale = Math.ceil(target / base);
  return entries.map(e => Object.assign({}, e, {qty: e.qty * scale}));
}

// ========== RENDER GRID ==========

function renderGrid() {
  let list = URUNLER.slice();
  if (searchQ) {
    const q = searchQ.toLowerCase();
    list = list.filter(p => p.a.toLowerCase().includes(q) || p.b.toLowerCase().includes(q));
  }
  if (sortKey === 'pa') list.sort((a,b) => a.f - b.f);
  else if (sortKey === 'pd') list.sort((a,b) => b.f - a.f);
  else list.sort((a,b) => a.a.localeCompare(b.a,'tr'));

  document.getElementById('rcount').textContent = list.length + ' / ' + URUNLER.length;
  document.getElementById('selcnt').textContent = selMap.size + ' seçili';

  const chk = '<svg width="9" height="9" viewBox="0 0 9 9"><polyline points="1,4.5 3.5,7 8,2" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  document.getElementById('grid').innerHTML = !list.length
    ? '<div style="padding:30px;text-align:center;color:var(--mut);font-size:13px">Ürün bulunamadı</div>'
    : list.map(p => {
        if (editMode) {
          const av = p.f > 0 ? p.f.toFixed(2) : '';
          return '<div class="card" data-b="' + escA(p.b) + '" style="cursor:default">'
            + '<div class="cn">' + escH(p.a) + '</div>'
            + '<div class="cb">' + escH(p.b) + '</div>'
            + '<div style="display:flex;align-items:center;gap:5px;margin-top:6px">'
            + '<input class="pi" type="number" min="0" step="0.01" style="width:90px;font-size:12px"'
            + ' value="' + escA(av) + '" placeholder="0.00"'
            + ' data-b="' + escA(p.b) + '" data-f="grid-alis">'
            + '<span style="font-size:9.5px;color:var(--sub)">alış ₺</span>'
            + '</div></div>';
        }
        const s = selMap.has(p.b);
        return '<div class="card' + (s ? ' sel' : '') + '" data-b="' + escA(p.b) + '">'
          + '<div class="cc">' + (s ? chk : '') + '</div>'
          + '<div class="cn">' + escH(p.a) + '</div>'
          + '<div class="cb">' + escH(p.b) + '</div>'
          + '<div class="cf">' + tl(p.f) + '<span>alış</span></div>'
          + '</div>';
      }).join('');
}

        + ' value="' + escA(String(e.satis||'')) + '"'
        + ' placeholder="fiyat girin"'
        + ' data-b="' + escA(e.b) + '" data-f="satis"></label>'
      + '<label>Adet<input class="pi w54" type="number" min="1" step="1"'
        + ' value="' + qv + '"'
        + ' data-b="' + escA(e.b) + '" data-f="qty"></label>'
      + '<label>Kom %<input class="pi w60" type="number" min="0" max="100" step="0.1"'
        + ' value="' + escA(String(e.kom||'')) + '"'
        + ' placeholder="opsiyonel"'
        + ' data-b="' + escA(e.b) + '" data-f="kom"></label>'
      + '<button class="rm-btn" data-b="' + escA(e.b) + '">×</button>'
      + '</div></div>';
  }

  html += '</div>';
  html += '<div id="cres"></div>';

  ri.innerHTML = html;
  updateResults();
}

function updateResults() {
  const area = document.getElementById('cres');
  if (!area) return;

  const pf = getPF();
  const entries = [];
  for (const e of selMap.values()) {
    if (+e.satis > 0) {
      entries.push({b:e.b, a:e.a, alis:+e.alis||0, satis:+e.satis, qty:Math.max(1,+e.qty||1), kom:+e.kom||0});
    }
  }

  if (!entries.length) {
    area.innerHTML = '<div class="hint">💡 Hesaplama için satış fiyatı girin</div>';
    return;
  }

  const sc0 = calcScenario(entries, pf);
  if (!sc0) { area.innerHTML = ''; return; }

  let html = '<div class="sec-title" style="margin-bottom:6px">📊 Senaryo Analizi</div><div class="sc-wrap">';

  html += buildScCard('Mevcut Sepet', sc0, '', entries);

  if (sc0.combined < 200) {
    const e2 = scaleToTarget(entries, 200);
    const sc2 = calcScenario(e2, pf);
    const scale = Math.ceil(200 / sc0.combined);
    if (sc2) html += buildScCard('200 ₺ Dilimi', sc2, '×' + scale + ' kat', e2);
  }

  if (sc0.combined < 350) {
    const e3 = scaleToTarget(entries, 350);
    const sc3 = calcScenario(e3, pf);
    const scale = Math.ceil(350 / sc0.combined);
    if (sc3) html += buildScCard('350 ₺ Dilimi', sc3, '×' + scale + ' kat', e3);
  }

  html += '</div>';
  area.innerHTML = html;
}

function buildScCard(title, sc, badge, entries) {
  const savPos = sc.savings > 0;
  const kBracket = sc.combined < 200 ? '41 ₺ kargo dilimi' : sc.combined < 350 ? '79 ₺ kargo dilimi' : '93 ₺ kargo dilimi';

  const totalAlis  = entries.reduce(function(s,e){ return s + (+e.alis||0) * e.qty; }, 0);
  const discRatio  = sc.combined > 0 ? sc.discBasket / sc.combined : 1;
  const totalKom   = entries.reduce(function(s,e){ return s + e.satis * e.qty * discRatio * (+e.kom||0) / 100; }, 0);
  const r = 20 / 120;
  const pf = getPF();
  const stopaj       = sc.discBasket / 1.20 * 0.01;
  const kdvSatis     = sc.discBasket * r;
  const kdvAlis      = totalAlis * r;
  const kdvKargo     = sc.kargoComb * r;
  const kdvKomisyon  = totalKom * r;
  const kdvHizmet    = pf * r;
  const odenecekKdv  = Math.max(0, kdvSatis - (kdvAlis + kdvKargo + kdvKomisyon + kdvHizmet));
  const profit       = sc.discBasket - totalAlis - sc.kargoComb - pf - totalKom - stopaj - odenecekKdv;
  const profitRate   = totalAlis > 0 ? profit / totalAlis * 100 : null;
  const profitClr    = profit >= 0 ? 'var(--grn)' : 'var(--red)';

  let html = '<div class="sc-card">'
    + '<div class="sc-hd">'
    + '<span class="sc-ttl">' + escH(title) + '</span>'
    + (badge ? '<span class="badge">' + escH(badge) + '</span>' : '')
    + '</div>'
    + '<div class="sc-grid">'
    + scIt('Sepet Tutarı', tl(sc.combined), kBracket, '')
    + scIt('Kargo (Kampanya)', tl(sc.kargoComb), 'Ayrı ayrı: ' + tl(sc.sepCost), '')
    + scIt('Tasarruf', tl(Math.max(0, sc.savings)), savPos ? 'indirim kaynağı' : 'tasarruf yok', savPos ? 'grn' : 'red')
    + scIt('Maks. İndirim', '%' + sc.maxPct.toFixed(1), 'Önerilen: %' + sc.recPct.toFixed(1), sc.maxPct > 0 ? 'acc' : '')
    + '</div>';

  const totalQty = entries.reduce(function(s,e){ return s + e.qty; }, 0);
  const hasFooter = savPos || totalAlis > 0;
  if (hasFooter) {
    html += '<div class="sc-footer">';
    if (savPos) {
      const discPerUnit = (sc.savings * 0.7) / totalQty;
      html += '<div class="sc-fi"><div class="sc-fl">Önerilen indirimle sepet</div><div class="sc-fv">' + tl(sc.discBasket) + '</div></div>'
        + '<div class="sc-fi"><div class="sc-fl">Ort. indirim / adet</div><div class="sc-fv">' + tl(discPerUnit) + '</div></div>';
    }
    if (totalKom > 0) {
      html += '<div class="sc-fi"><div class="sc-fl">Komisyon</div><div class="sc-fv" style="color:var(--red)">' + tl(totalKom) + '</div></div>';
    }
    if (totalAlis > 0) {
      html += '<div class="sc-fi"><div class="sc-fl">Tahmini Kâr</div><div class="sc-fv" style="color:' + profitClr + '">' + tl(profit) + '</div></div>'
        + '<div class="sc-fi"><div class="sc-fl">Kâr Oranı</div><div class="sc-fv" style="color:' + profitClr + '">%' + profitRate.toFixed(1) + '</div></div>';
    }
    html += '</div>';
  }

  if (entries.length > 1 || entries[0].qty > 1) {
    html += '<div class="sc-qty">'
      + entries.map(e => escH(e.a.length > 35 ? e.a.substring(0,35) + '…' : e.a) + ' × ' + e.qty + ' adet').join('<br>')
      + '</div>';
  }

  if (totalAlis > 0) {
    html += buildEvalBlock(entries, sc, profit, profitRate, pf);
  }

  html += '</div>';
  return html;
}

function scIt(lbl, val, sub, cls) {
  return '<div class="sc-it' + (cls ? ' ' + cls : '') + '">'
    + '<div class="sc-il">' + escH(lbl) + '</div>'
    + '<div class="sc-iv">' + val + '</div>'
    + '<div class="sc-is">' + escH(sub) + '</div>'
    + '</div>';
}

function scheduleCalc() {
  clearTimeout(calcTimer);
  calcTimer = setTimeout(updateResults, 280);
}

// ========== UI EVENTS ==========

function onSearch() {
  searchQ = document.getElementById('sq').value.trim();
  renderGrid();
}

function setSort(k) {
  sortKey = k;
  document.querySelectorAll('.sb').forEach(b => b.classList.toggle('act', b.dataset.sk === k));
  renderGrid();
}

function toggleTheme() {
  const r = document.documentElement;
  const cur = r.dataset.theme || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
  r.dataset.theme = cur === 'dark' ? 'light' : 'dark';
}

// Grid click: select / deselect product (edit modunda devre dışı)
document.getElementById('grid').addEventListener('click', function(e) {
  if (editMode) return;
  const card = e.target.closest('.card');
  if (!card) return;
  const b = card.dataset.b;
  const p = URUNLER.find(function(x){ return x.b === b; });
  if (!p) return;
  if (selMap.has(b)) {
    selMap.delete(b);
  } else {
    const savedAlis = maliyetler[b] || p.f;
    selMap.set(b, {b:p.b, a:p.a, alis:savedAlis, satis:'', qty:1, kom:'', _qtyManual:false});
  }
  renderGrid();
  renderRight();
});

// Grid edit modu: alış fiyatı güncelle
document.getElementById('grid').addEventListener('change', function(e) {
  var inp = e.target;
  if (!editMode || inp.dataset.f !== 'grid-alis') return;
  var b = inp.dataset.b;
  var n = parseFloat(inp.value);
  if (!b) return;
  var pu = URUNLER.find(function(x){ return x.b === b; });
  if (pu && n > 0) {
    pu.f = n;
    maliyetler[b] = n;
    saveMaliyetler();
    // Açık seçimde de güncelle
    if (selMap.has(b)) selMap.get(b).alis = n;
    try { localStorage.setItem('kampanya_urunler_v1', JSON.stringify(URUNLER)); } catch(x) {}
  }
});

// Right panel clicks: platform toggle, remove button
document.getElementById('ri').addEventListener('click', function(e) {
  const platBtn = e.target.closest('.pf-btn');
  if (platBtn && platBtn.dataset.plat) {
    platMode = platBtn.dataset.plat;
    document.querySelectorAll('.pf-btn').forEach(function(b){ b.classList.toggle('act', b.dataset.plat === platMode); });
    scheduleCalc();
    return;
  }
  const rmBtn = e.target.closest('.rm-btn');
  if (rmBtn && rmBtn.dataset.b) {
    selMap.delete(rmBtn.dataset.b);
    renderGrid();
    renderRight();
  }
});

// Right panel input: update state, save alis to localStorage, auto-qty
document.getElementById('ri').addEventListener('input', function(e) {
  const inp = e.target;
  if (inp.id === 'hedefOranInp') {
    var v = parseFloat(inp.value);
    if (!isNaN(v) && v >= 0) { hedefOran = v; updateResults(); }
    return;
  }
  if (!inp.dataset.b || !inp.dataset.f) return;
  const b = inp.dataset.b;
  const f = inp.dataset.f;
  const v = inp.value;
  if (!selMap.has(b)) return;
  const item = selMap.get(b);

  if (f === 'alis') {
    const n = +v;
    item.alis = n >= 0 ? n : 0;
    if (n > 0) {
      maliyetler[b] = n;
      saveMaliyetler();
      // Sync product card display
      const pu = URUNLER.find(function(x){ return x.b === b; });
      if (pu) pu.f = n;
    }
  } else {
    item[f] = v;
  }

  if (f === 'satis' && +v > 0 && !item._qtyManual) {
    const mq = minQty(+v);
    item.qty = mq;
    try {
      const qInp = document.querySelector('[data-b="' + CSS.escape(b) + '"][data-f="qty"]');
      if (qInp) qInp.value = mq;
    } catch(ex) {}
  }
  if (f === 'qty') item._qtyManual = true;
  scheduleCalc();
});

// ========== EXCEL UPLOAD ==========

document.getElementById('urunXlsxIn').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;
  e.target.value = '';
  if (typeof JSZip === 'undefined') {
    showToast('JSZip yüklenemedi — sayfayı yenileyip tekrar deneyin.', false);
    return;
  }
  var rd = new FileReader();
  rd.onload = async function(ev) {
    try {
      var urunler = await parseUrunlerXlsx(ev.target.result);
      // Exceldeki alış fiyatlarını maliyetler'e kaydet
      urunler.forEach(function(u){
        if (u.f > 0) maliyetler[u.b] = u.f;
      });
      saveMaliyetler();
      // Kayıtlı maliyet varsa onu kullan (daha önce elle girilmiş değer öncelikli)
      urunler.forEach(function(u){ if (maliyetler[u.b]) u.f = maliyetler[u.b]; });
      URUNLER = urunler;
      try { localStorage.setItem('kampanya_urunler_v1', JSON.stringify(urunler)); } catch(x) {}
      selMap.clear();
      renderGrid();
      renderRight();
      showToast(urunler.length + ' ürün yüklendi', true);
    } catch(err) {
      showToast(err.message, false);
    }
  };
  rd.readAsArrayBuffer(file);
});


// Init
renderGrid();
</script>
