<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trendyol Komisyon Karlılık Hesaplayıcı</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a2e; min-height: 100vh; }

  /* HEADER */
  .header { background: linear-gradient(135deg, #f27a1a 0%, #e55a00 100%); color: white; padding: 16px 24px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
  .header-logo { font-size: 24px; }
  .header h1 { font-size: 18px; font-weight: 700; }
  .header p { font-size: 12px; opacity: 0.85; margin-top: 2px; }

  /* LAYOUT */
  .container { display: grid; grid-template-columns: 380px 1fr; gap: 0; height: calc(100vh - 64px); }

  /* LEFT PANEL */
  .left-panel { background: white; border-right: 1px solid #e8e8e8; display: flex; flex-direction: column; overflow: hidden; }
  .search-box { padding: 12px; border-bottom: 1px solid #f0f0f0; background: #fafafa; }
  .search-box input { width: 100%; padding: 10px 14px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 13px; outline: none; transition: border-color 0.2s; }
  .search-box input:focus { border-color: #f27a1a; }
  .filter-row { display: flex; gap: 8px; margin-top: 8px; }
  .filter-row select { flex: 1; padding: 7px 10px; border: 1.5px solid #ddd; border-radius: 6px; font-size: 12px; outline: none; background: white; }
  .filter-row select:focus { border-color: #f27a1a; }

  .product-list { flex: 1; overflow-y: auto; }
  .product-item { padding: 12px 14px; border-bottom: 1px solid #f5f5f5; cursor: pointer; transition: all 0.15s; display: flex; align-items: flex-start; gap: 10px; }
  .product-item:hover { background: #fff8f0; }
  .product-item.active { background: #fff3e8; border-left: 3px solid #f27a1a; }
  .product-icon { width: 36px; height: 36px; background: linear-gradient(135deg, #f27a1a22, #f27a1a11); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .product-info { flex: 1; min-width: 0; }
  .product-name { font-size: 12px; font-weight: 600; color: #1a1a2e; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .product-meta { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 500; }
  .badge-cat { background: #e8f4fd; color: #1976d2; }
  .badge-brand { background: #f3e5f5; color: #7b1fa2; }
  .badge-stok { background: #e8f5e9; color: #2e7d32; }
  .badge-stok.low { background: #fff3e0; color: #e65100; }
  .badge-stok.critical { background: #ffebee; color: #c62828; }
  .product-price { font-size: 12px; font-weight: 700; color: #f27a1a; margin-top: 3px; }

  .list-header { padding: 8px 14px; font-size: 11px; color: #888; background: #f9f9f9; border-bottom: 1px solid #f0f0f0; font-weight: 600; }

  /* RIGHT PANEL */
  .right-panel { overflow-y: auto; padding: 20px; }

  /* EMPTY STATE */
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #aaa; gap: 12px; }
  .empty-state .icon { font-size: 64px; }
  .empty-state p { font-size: 14px; }

  /* PRODUCT DETAIL */
  .detail-header { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .detail-title { font-size: 16px; font-weight: 700; color: #1a1a2e; line-height: 1.4; margin-bottom: 8px; }
  .detail-badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .detail-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .stat-card { background: #f8f8f8; border-radius: 8px; padding: 10px 12px; text-align: center; }
  .stat-label { font-size: 10px; color: #888; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { font-size: 16px; font-weight: 700; color: #1a1a2e; margin-top: 3px; }
  .stat-value.orange { color: #f27a1a; }
  .stat-value.green { color: #2e7d32; }

  /* COST INPUT */
  .cost-section { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .cost-section h3 { font-size: 14px; font-weight: 700; color: #1a1a2e; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
  .cost-input-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  .input-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 150px; }
  .input-group label { font-size: 12px; color: #666; font-weight: 500; }
  .input-group input { padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; font-weight: 600; outline: none; transition: border-color 0.2s; }
  .input-group input:focus { border-color: #f27a1a; }
  .calc-btn { padding: 10px 20px; background: linear-gradient(135deg, #f27a1a, #e55a00); color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; transition: opacity 0.2s; white-space: nowrap; }
  .calc-btn:hover { opacity: 0.9; }

  /* TARIFE TOGGLE */
  .tarife-toggle { display: flex; gap: 8px; margin-top: 12px; }
  .toggle-btn { flex: 1; padding: 8px; border: 2px solid #e0e0e0; border-radius: 8px; background: white; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; color: #666; }
  .toggle-btn.active { border-color: #f27a1a; background: #fff3e8; color: #f27a1a; }

  /* RESULTS TABLE */
  .results-section { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .results-section h3 { font-size: 14px; font-weight: 700; color: #1a1a2e; margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }

  .tier-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 900px) { .tier-grid { grid-template-columns: repeat(4, 1fr); } }

  .tier-card { border: 2px solid #e8e8e8; border-radius: 12px; padding: 16px; transition: all 0.2s; position: relative; overflow: hidden; }
  .tier-card.current { border-color: #1976d2; background: #e3f2fd; }
  .tier-card.best-profit { border-color: #2e7d32; background: #e8f5e9; }
  .tier-card.profitable { border-color: #f27a1a22; }
  .tier-card.loss { border-color: #ffcdd2; background: #fff8f8; opacity: 0.75; }
  .tier-card.no-calc { background: #f9f9f9; }

  .tier-badge { position: absolute; top: 8px; right: 8px; font-size: 9px; font-weight: 700; padding: 3px 7px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
  .tier-badge.current { background: #1976d2; color: white; }
  .tier-badge.best { background: #2e7d32; color: white; }
  .tier-badge.loss-badge { background: #c62828; color: white; }

  .tier-number { font-size: 11px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 1px; }
  .tier-range { font-size: 12px; color: #555; margin: 6px 0; line-height: 1.4; }
  .tier-range strong { color: #1a1a2e; }
  .tier-komisyon { font-size: 22px; font-weight: 800; color: #f27a1a; margin: 8px 0 4px; }
  .tier-komisyon span { font-size: 13px; font-weight: 500; color: #888; }
  
  .tier-divider { border: none; border-top: 1px solid #e8e8e8; margin: 10px 0; }
  .tier-row { display: flex; justify-content: space-between; align-items: center; margin: 4px 0; }
  .tier-row-label { font-size: 11px; color: #777; }
  .tier-row-value { font-size: 13px; font-weight: 700; }
  .tier-row-value.green { color: #2e7d32; }
  .tier-row-value.red { color: #c62828; }
  .tier-row-value.blue { color: #1976d2; }

  .profit-highlight { margin-top: 10px; padding: 8px 10px; border-radius: 8px; text-align: center; }
  .profit-highlight.profit { background: #c8e6c9; }
  .profit-highlight.loss { background: #ffcdd2; }
  .profit-highlight .amount { font-size: 18px; font-weight: 800; }
  .profit-highlight .amount.green { color: #1b5e20; }
  .profit-highlight .amount.red { color: #b71c1c; }
  .profit-highlight .pct { font-size: 11px; color: #555; margin-top: 2px; }

  /* BEST SUMMARY */
  .best-summary { background: linear-gradient(135deg, #e8f5e9, #c8e6c9); border: 2px solid #4caf50; border-radius: 12px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 14px; }
  .best-summary .icon { font-size: 32px; }
  .best-summary h4 { font-size: 14px; font-weight: 700; color: #1b5e20; }
  .best-summary p { font-size: 12px; color: #2e7d32; margin-top: 3px; }

  .no-profit-warning { background: #fff3e0; border: 2px solid #ff9800; border-radius: 12px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 14px; }
  .no-profit-warning .icon { font-size: 32px; }
  .no-profit-warning h4 { font-size: 14px; font-weight: 700; color: #e65100; }
  .no-profit-warning p { font-size: 12px; color: #bf360c; margin-top: 3px; }

  .scrollbar::-webkit-scrollbar { width: 6px; }
  .scrollbar::-webkit-scrollbar-track { background: #f0f0f0; }
  .scrollbar::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }
</style>
</head>

;

let selectedProduct = null;
let currentTarife = '3gun'; // or '4gun'

// Initialize
function init() {
  // Populate filters
  const cats = [...new Set(PRODUCTS.map(p => p.kategori))].sort();
  const brands = [...new Set(PRODUCTS.map(p => p.marka))].sort();
  const catSel = document.getElementById('catFilter');
  const brandSel = document.getElementById('brandFilter');
  cats.forEach(c => { const o = document.createElement('option'); o.value = c; o.text = c; catSel.add(o); });
  brands.forEach(b => { const o = document.createElement('option'); o.value = b; o.text = b; brandSel.add(o); });
  renderList(PRODUCTS);
}

function categoryEmoji(kat) {
  const map = {'Toka':'💇','Anahtarlık':'🔑','Balon':'🎈','Maket Bıçak':'🔪','Eğitici Oyuncak':'🧩','Cetvel':'📏','Askılık':'🧥','Karakter Figür Oyuncak':'🎭','Bijuteri Kolye':'📿','Oyun Hamuru':'🎨','Temizlik Bezi':'🧹','Pasta Cila':'✨'};
  return map[kat] || '📦';
}

function stokClass(s) {
  if (s <= 1) return 'critical';
  if (s <= 5) return 'low';
  return '';
}

function filterProducts() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const cat = document.getElementById('catFilter').value;
  const brand = document.getElementById('brandFilter').value;
  const filtered = PRODUCTS.filter(p => {
    const matchQ = !q || p.urun.toLowerCase().includes(q) || p.barkod.toLowerCase().includes(q) || p.marka.toLowerCase().includes(q);
    const matchCat = !cat || p.kategori === cat;
    const matchBrand = !brand || p.marka === brand;
    return matchQ && matchCat && matchBrand;
  });
  renderList(filtered);
}

function renderList(products) {
  const container = document.getElementById('productList');
  document.getElementById('listHeader').textContent = products.length + ' ürün';
  container.innerHTML = products.map((p, i) => {
    const idx = PRODUCTS.indexOf(p);
    const sc = stokClass(p.stok);
    return `<div class="product-item" id="pi_${idx}" onclick="selectProduct(${idx})">
      <div class="product-icon">${categoryEmoji(p.kategori)}</div>
      <div class="product-info">
        <div class="product-name" title="${p.urun}">${p.urun}</div>
        <div class="product-meta">
          <span class="badge badge-cat">${p.kategori}</span>
          <span class="badge badge-brand">${p.marka}</span>
          <span class="badge badge-stok ${sc}">Stok: ${p.stok}</span>
        </div>
        <div class="product-price">TSF: ${p.guncel_tsf ? p.guncel_tsf.toFixed(2) + ' ₺' : '-'} &nbsp; Kom: %${p.guncel_komisyon || '-'}</div>
      </div>
    </div>`;
  }).join('');
}

function selectProduct(idx) {
  selectedProduct = idx;
  // Update active class
  document.querySelectorAll('.product-item').forEach(el => el.classList.remove('active'));
  const el = document.getElementById('pi_' + idx);
  if (el) { el.classList.add('active'); el.scrollIntoView({block:'nearest'}); }
  renderDetail();
}

function renderDetail() {
  const p = PRODUCTS[selectedProduct];
  if (!p) return;

  const costVal = parseFloat(document.getElementById('costInput') ? document.getElementById('costInput').value : '') || 0;
  const sc = stokClass(p.stok);

  let html = `
  <div class="detail-header">
    <div class="detail-title">${p.urun}</div>
    <div class="detail-badges">
      <span class="badge badge-cat">${p.kategori}</span>
      <span class="badge badge-brand">${p.marka}</span>
      ${p.barkod ? `<span class="badge" style="background:#f5f5f5;color:#555">Barkod: ${p.barkod}</span>` : ''}
      ${p.tarife ? `<span class="badge" style="background:#e8f4fd;color:#1565c0">Tarife: ${p.tarife}</span>` : ''}
    </div>
    <div class="detail-stats">
      <div class="stat-card">
        <div class="stat-label">Güncel TSF</div>
        <div class="stat-value orange">${p.guncel_tsf ? p.guncel_tsf.toFixed(2) + ' ₺' : '-'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Güncel Komisyon</div>
        <div class="stat-value orange">${p.guncel_komisyon ? '%' + p.guncel_komisyon : '-'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Stok</div>
        <div class="stat-value ${sc === 'critical' ? 'red' : sc === 'low' ? 'orange' : ''}" style="${sc==='critical'?'color:#c62828':sc==='low'?'color:#e65100':''}">${p.stok} adet</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Kom. Esas Fiyat</div>
        <div class="stat-value">${p.komisyon_fiyat ? p.komisyon_fiyat.toFixed(2) + ' ₺' : '-'}</div>
      </div>
    </div>
  </div>

  <div class="cost-section">
    <h3>💰 Maliyet Girişi</h3>
    <div class="cost-input-row">
      <div class="input-group">
        <label>Ürün Maliyetiniz (₺) — KDV dahil, kargo hariç</label>
        <input type="number" id="costInput" placeholder="Örn: 85.00" min="0" step="0.01" value="${costVal || ''}" oninput="calculate()">
      </div>
      <button class="calc-btn" onclick="calculate()">📊 Hesapla</button>
    </div>
    <div class="tarife-toggle">
      <button class="toggle-btn ${currentTarife==='3gun'?'active':''}" onclick="switchTarife('3gun')">
        📅 3 Günlük Tarife<br><small style="font-weight:400;font-size:10px">${p.tarih_3gun || ''}</small>
      </button>
      <button class="toggle-btn ${currentTarife==='4gun'?'active':''}" onclick="switchTarife('4gun')">
        📅 4 Günlük Tarife<br><small style="font-weight:400;font-size:10px">${p.tarih_4gun || ''}</small>
      </button>
    </div>
  </div>

  <div class="results-section">
    <h3>📈 Tarife Karşılaştırması</h3>
    <div id="resultsContent">
      <p style="color:#aaa;font-size:13px;text-align:center;padding:20px">Maliyet girerek hesapla butonuna tıklayın</p>
    </div>
  </div>`;

  document.getElementById('rightPanel').innerHTML = html;

  // If there's a cost, auto-calculate
  if (costVal > 0) calculate();
}

function switchTarife(t) {
  currentTarife = t;
  renderDetail();
  // Restore cost input
  setTimeout(() => {
    const inp = document.getElementById('costInput');
    if (inp && inp.value) calculate();
  }, 50);
}

function calculate() {
  const p = PRODUCTS[selectedProduct];
  if (!p) return;
  const costInput = document.getElementById('costInput');
  if (!costInput) return;
  const cost = parseFloat(costInput.value);
  if (!cost || cost <= 0) {
    document.getElementById('resultsContent').innerHTML = '<p style="color:#e65100;font-size:13px;text-align:center;padding:20px">⚠️ Lütfen geçerli bir maliyet girin</p>';
    return;
  }

  // Determine which commission rates to use
  const k = currentTarife === '3gun' 
    ? [p.k3_1, p.k3_2, p.k3_3, p.k3_4]
    : [p.k4_1, p.k4_2, p.k4_3, p.k4_4];

  // Price ranges for each tier
  // Tier 1: TSF >= f1_alt (no upper limit; use f1_alt as min price)
  // Tier 2: f2_alt <= TSF <= f2_ust
  // Tier 3: f3_alt <= TSF <= f3_ust
  // Tier 4: TSF <= f4_ust
  const tiers = [
    { num: 1, label: '1. Aralık (En Yüksek Fiyat)', minPrice: p.f1_alt, maxPrice: null, komisyon: k[0], rangeText: `${p.f1_alt ? p.f1_alt.toFixed(2) + ' ₺ ve üstü' : '-'}` },
    { num: 2, label: '2. Aralık', minPrice: p.f2_alt, maxPrice: p.f2_ust, komisyon: k[1], rangeText: `${p.f2_alt ? p.f2_alt.toFixed(2) : '-'} ₺ — ${p.f2_ust ? p.f2_ust.toFixed(2) : '-'} ₺` },
    { num: 3, label: '3. Aralık', minPrice: p.f3_alt, maxPrice: p.f3_ust, komisyon: k[2], rangeText: `${p.f3_alt ? p.f3_alt.toFixed(2) : '-'} ₺ — ${p.f3_ust ? p.f3_ust.toFixed(2) : '-'} ₺` },
    { num: 4, label: '4. Aralık (En Düşük Fiyat)', minPrice: null, maxPrice: p.f4_ust, komisyon: k[3], rangeText: `${p.f4_ust ? p.f4_ust.toFixed(2) + ' ₺ ve altı' : '-'}` },
  ];

  // Determine current tier based on current TSF
  const tsf = p.guncel_tsf;
  let currentTier = -1;
  if (tsf && p.f1_alt && tsf >= p.f1_alt) currentTier = 0;
  else if (tsf && p.f2_alt && p.f2_ust && tsf >= p.f2_alt && tsf <= p.f2_ust) currentTier = 1;
  else if (tsf && p.f3_alt && p.f3_ust && tsf >= p.f3_alt && tsf <= p.f3_ust) currentTier = 2;
  else if (tsf && p.f4_ust && tsf <= p.f4_ust) currentTier = 3;

  // Calculate profits for each tier using the max available price in that tier
  const results = tiers.map((tier, i) => {
    if (tier.komisyon == null) return { ...tier, profit: null, netGelir: null, sellPrice: null };
    // Use max sell price for the tier
    let sellPrice;
    if (i === 0) sellPrice = tier.minPrice; // minimum eligible price for tier 1 (actually we use f1_alt as the minimum)
    else if (i === 3) sellPrice = tier.maxPrice; // max for tier 4
    else sellPrice = tier.maxPrice; // use upper limit for tier 2, 3

    // For tier 1, the sell price could be the current TSF or the min price of the tier
    if (i === 0) sellPrice = Math.max(tier.minPrice || 0, tsf || tier.minPrice || 0);

    if (!sellPrice) return { ...tier, profit: null, netGelir: null, sellPrice: null };

    const komisyonTutar = sellPrice * (tier.komisyon / 100);
    const netGelir = sellPrice - komisyonTutar;
    const profit = netGelir - cost;
    const profitPct = (profit / sellPrice * 100);
    const margin = (profit / cost * 100);
    return { ...tier, sellPrice, komisyonTutar, netGelir, profit, profitPct, margin, isCurrent: i === currentTier };
  });

  // Find best profit
  const validResults = results.filter(r => r.profit != null);
  const bestProfit = validResults.length > 0 ? Math.max(...validResults.map(r => r.profit)) : null;
  const bestIdx = validResults.findIndex(r => r.profit === bestProfit);

  // Summary banner
  let summaryHtml = '';
  if (bestProfit != null && bestProfit > 0) {
    const best = validResults[bestIdx];
    summaryHtml = `<div class="best-summary">
      <div class="icon">🏆</div>
      <div>
        <h4>En Karlı Seçenek: ${best.label}</h4>
        <p>Satış fiyatı <strong>${best.sellPrice.toFixed(2)} ₺</strong>'ye ayarlayarak <strong>${best.profit.toFixed(2)} ₺</strong> kar elde edersiniz (%${best.profitPct.toFixed(1)} marj)</p>
      </div>
    </div>`;
  } else if (bestProfit != null && bestProfit <= 0) {
    summaryHtml = `<div class="no-profit-warning">
      <div class="icon">⚠️</div>
      <div>
        <h4>Hiçbir tarife karlı değil!</h4>
        <p>Girdiğiniz maliyet (${cost.toFixed(2)} ₺) mevcut fiyat aralıklarında zarar ettiriyor. Maliyeti düşürmeyi veya TSF'yi artırmayı değerlendirin.</p>
      </div>
    </div>`;
  }

  const tierCards = results.map((r, i) => {
    let cardClass = 'tier-card';
    let badgeHtml = '';
    
    if (r.isCurrent) { cardClass += ' current'; badgeHtml = '<span class="tier-badge current">Aktif</span>'; }
    
    if (r.profit != null) {
      if (r.profit === bestProfit && r.profit > 0 && validResults[bestIdx] === r) {
        cardClass += ' best-profit';
        badgeHtml = '<span class="tier-badge best">🏆 En Karlı</span>';
      } else if (r.profit > 0) {
        cardClass += ' profitable';
      } else {
        cardClass += ' loss';
        if (!badgeHtml) badgeHtml = '<span class="tier-badge loss-badge">Zarar</span>';
      }
    } else {
      cardClass += ' no-calc';
    }

    const profitSection = r.profit != null ? `
    <hr class="tier-divider">
    <div class="tier-row">
      <span class="tier-row-label">Satış Fiyatı</span>
      <span class="tier-row-value blue">${r.sellPrice.toFixed(2)} ₺</span>
    </div>
    <div class="tier-row">
      <span class="tier-row-label">Komisyon</span>
      <span class="tier-row-value red">-${r.komisyonTutar.toFixed(2)} ₺</span>
    </div>
    <div class="tier-row">
      <span class="tier-row-label">Net Gelir</span>
      <span class="tier-row-value">${r.netGelir.toFixed(2)} ₺</span>
    </div>
    <div class="tier-row">
      <span class="tier-row-label">Maliyet</span>
      <span class="tier-row-value red">-${cost.toFixed(2)} ₺</span>
    </div>
    <div class="profit-highlight ${r.profit >= 0 ? 'profit' : 'loss'}">
      <div class="amount ${r.profit >= 0 ? 'green' : 'red'}">${r.profit >= 0 ? '+' : ''}${r.profit.toFixed(2)} ₺</div>
      <div class="pct">%${r.profitPct.toFixed(1)} marj &nbsp;|&nbsp; %${r.margin.toFixed(1)} ROI</div>
    </div>` : '<p style="color:#bbb;font-size:12px;margin-top:10px;text-align:center">Veri eksik</p>';

    return `<div class="${cardClass}">
      ${badgeHtml}
      <div class="tier-number">Tarife ${r.num}</div>
      <div class="tier-range">${r.rangeText}</div>
      <div class="tier-komisyon">%${r.komisyon != null ? r.komisyon : '-'} <span>komisyon</span></div>
      ${profitSection}
    </div>`;
  }).join('');

  document.getElementById('resultsContent').innerHTML = summaryHtml + `<div class="tier-grid">${tierCards}</div>
  <p style="color:#bbb;font-size:11px;margin-top:12px;text-align:center">* Kar hesabında kargo, iade ve diğer giderler dahil değildir. Komisyon tutarı KDV hariçtir.</p>`;
}

init();
</script>
</body>
</html>
